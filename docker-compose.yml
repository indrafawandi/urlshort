services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: urlshort
      POSTGRES_PASSWORD: urlshort
      POSTGRES_DB: urlshort
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshort"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      URLSHORT_DATABASE_URL: postgresql+psycopg2://urlshort:urlshort@db:5432/urlshort
      URLSHORT_BASE_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
