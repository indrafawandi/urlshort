name: Destroy AWS stack (ECS Fargate)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm — this tears down the live demo stack'
        required: true

permissions:
  id-token: write
  contents: read

env:
  TF_DIR: infra/environments/demo

jobs:
  destroy:
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=urlshort/demo/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Terraform destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform destroy -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="project_name=${{ vars.PROJECT_NAME }}" \
            -var="container_image=placeholder"
