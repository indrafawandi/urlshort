name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t urlshort:ci .

      - name: Smoke test container
        run: |
          docker run -d --name urlshort-ci -p 8000:8000 urlshort:ci

          healthy=0
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          # Always show what happened inside the container, pass or fail —
          # this is the actual diagnostic info; don't let a failed curl
          # (with `bash -e`) skip straight past it.
          echo "---- container logs ----"
          docker logs urlshort-ci
          echo "---- container status ----"
          docker inspect urlshort-ci --format '{{.State.Status}} (exit code {{.State.ExitCode}})'

          docker stop urlshort-ci > /dev/null 2>&1 || true
          docker rm urlshort-ci > /dev/null 2>&1 || true

          if [ "$healthy" -ne 1 ]; then
            echo "::error::Container never became healthy — see logs above."
            exit 1
          fi
