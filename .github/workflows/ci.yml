name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t urlshort:ci .

      - name: Smoke test container
        run: |
          docker run -d --name urlshort-ci -p 8000:8000 urlshort:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/healthz; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/healthz
          docker logs urlshort-ci
          docker stop urlshort-ci
